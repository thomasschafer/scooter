# Enables auto-merge on Dependabot pull requests whose every update is semver-compatible,
# so they merge once required checks pass. That means patch updates, and minor updates
# from 1.0 up: on 0.x a minor bump (0.4 to 0.5) is breaking, and on 0.0.x any bump is.
# Everything else, including updates whose type or version can't be determined, waits
# for review.
# Without required checks on the default branch this merges immediately.
name: Dependabot

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Check every update is compatible
        id: compatible
        env:
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          compatible=$(jq -r 'length > 0 and all(.[];
            ([(.newVersion // "") | ltrimstr("v") | capture("^(?<major>[0-9]+)\\.(?<minor>[0-9]+)(\\.[0-9]+)?([-+][0-9A-Za-z.+-]+)?$")?] | first) as $v
            | $v != null
              and ((.updateType == "version-update:semver-patch" and ($v.major != "0" or $v.minor != "0"))
                or (.updateType == "version-update:semver-minor" and $v.major != "0")))' <<<"$UPDATES")
          echo "compatible=$compatible" >>"$GITHUB_OUTPUT"

      - name: Merge when CI passes
        if: steps.compatible.outputs.compatible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
